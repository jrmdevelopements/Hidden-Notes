name: Deploy to cPanel

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Update
        run: |
          BASE_PATH="/home/omaarevv/public_html/hiddennotes.yesm8australia.com.au"
          
          # Logic to pick the right folder based on the branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            REPO_PATH="$BASE_PATH/live"
          else
            REPO_PATH="$BASE_PATH/staging"
          fi
          
          curl -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
          "${{ secrets.CPANEL_URL }}/execute/VersionControl/update?repository_root=$REPO_PATH"