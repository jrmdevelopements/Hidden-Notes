name: Deploy to cPanel

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger cPanel Update and Deploy
        run: |
          BASE_PATH="/home/omaarevv/public_html/hiddennotes.yesm8australia.com.au"
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            REPO_PATH="$BASE_PATH/live"
          else
            REPO_PATH="$BASE_PATH/staging"
          fi
          
          # 1. Update the Repository (This worked!)
          echo "Syncing code with server..."
          curl -X POST \
          -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          "${{ secrets.CPANEL_URL }}/execute/VersionControl/update?repository_root=$REPO_PATH"

          # 2. Deploy the Files (Corrected Command)
          echo "Running deployment tasks..."
          curl -X POST \
          -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          "${{ secrets.CPANEL_URL }}/execute/VersionControl/create_deployment?repository_root=$REPO_PATH"