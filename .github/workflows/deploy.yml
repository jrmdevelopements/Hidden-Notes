name: Deploy to cPanel

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger cPanel Update and Deploy
        run: |
          # 1. Logic to select the folder based on branch
          BASE_PATH="/home/omaarevv/public_html/hiddennotes.yesm8australia.com.au"
          
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            REPO_PATH="$BASE_PATH/live"
            BRANCH="main"
          else
            REPO_PATH="$BASE_PATH/staging"
            BRANCH="staging"
          fi
          
          echo "🚀 Deploying branch [$BRANCH] to path [$REPO_PATH]"

          # 2. Update the Repository on the server
          # Note: We use -v to see exactly why it fails if it does
          echo "Step 1: Pulling latest changes..."
          curl -v -X POST \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository_root=$REPO_PATH" \
            -d "branch=$BRANCH" \
            "${{ secrets.CPANEL_URL }}/execute/VersionControl/update"

          # 3. Trigger the .cpanel.yml tasks
          echo "Step 2: Executing deployment tasks..."
          curl -v -X POST \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository_root=$REPO_PATH" \
            "${{ secrets.CPANEL_URL }}/execute/VersionControlDeployment/create"