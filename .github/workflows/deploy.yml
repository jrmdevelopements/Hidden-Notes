name: Deploy to cPanel

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger cPanel Update and Deploy
        run: |
          # 1. Define the correct path based on the branch
          BASE_PATH="/home/omaarevv/public_html/hiddennotes.yesm8australia.com.au"
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            REPO_PATH="$BASE_PATH/live"
            BRANCH="main"
          else
            REPO_PATH="$BASE_PATH/staging"
            BRANCH="staging"
          fi
          
          echo "Targeting path: $REPO_PATH on branch: $BRANCH"
          
          # 2. Step One: Force the Version Control Update
          # We use -d to ensure cPanel receives the root and branch explicitly
          echo "Step 1: Fetching latest changes from GitHub to Server..."
          curl -X POST \
          -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
          -d "repository_root=$REPO_PATH" \
          -d "branch=$BRANCH" \
          "${{ secrets.CPANEL_URL }}/execute/VersionControl/update"

          # 3. Step Two: Trigger Deployment Tasks
          # This executes the logic inside your .cpanel.yml file
          echo "Step 2: Running .cpanel.yml deployment tasks..."
          curl -X POST \
          -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
          -d "repository_root=$REPO_PATH" \
          "${{ secrets.CPANEL_URL }}/execute/VersionControlDeployment/create"